name: Build EXE C++

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C++
        run: |
          mkdir output
          cl /EHsc /std:c++17 main.cpp /Fe:output\program.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-program-exe
          path: output/program.exe
